name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build standalone executable
        run: python scripts/build_executable.py
      - name: Create checksums and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = "KeyDeck-$tag.exe"
          Move-Item "dist\KeyDeck.exe" "dist\$asset"
          $hash = (Get-FileHash "dist\$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "dist\SHA256SUMS.txt" -Encoding ascii
          gh release create $tag "dist\$asset" "dist\SHA256SUMS.txt" `
            --title "KeyDeck $tag" --generate-notes
